spring.application.name=project
server.port=8080

# Force UTF-8 encoding for HTTP requests and static resources
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

logging.charset.console=UTF-8
logging.charset.file=UTF-8

# WeChat iLink integration settings
wechat.ilink.heartbeat-enabled=true
wechat.ilink.heartbeat-interval-ms=15000
wechat.ilink.auto-reply-enabled=true
wechat.ilink.recent-message-limit=200
wechat.ilink.media-merge-window-ms=5000
wechat.ilink.media-merge-max-buffers=256
wechat.ilink.media-fast-merge-window-ms=800
wechat.ilink.reply-threads=8
wechat.ilink.reply-queue-capacity=512
wechat.ilink.realtime-typing-enabled=true
wechat.ilink.typing-cooldown-ms=1200
wechat.ilink.search-before-reply=false
wechat.ilink.voice-reply-enabled=true
wechat.ilink.image-generation-threads=2
# Multi-user session: scan-login HTTP requests run on this thread pool to avoid blocking.
wechat.ilink.login-threads=4
# Persist each user's WeChat login token here so the session can resume after restart.
wechat.ilink.token-storage-dir=./data/user-tokens

# Multi-turn conversation memory settings
conversation.storage-dir=./data/conversations
conversation.window-size=10
conversation.summary-enabled=true
conversation.summary-trigger=6
conversation.summary-max-chars=800
conversation.summary.llm-enabled=true

# DashScope / Alibaba Cloud Bailian LLM settings
# 说明：qwen-plus = 更强 tool-calling / 生成质量更高；qwen-turbo = 成本最低（5倍价差）。
# 两个模型的免费额度独立不互通；plus 额度耗尽时可临时切到 turbo。
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.text-model=qwen-plus
llm.vision-model=qwen-vl-plus
llm.max-tokens=4096
llm.timeout-seconds=60
llm.tool-max-rounds=5

# Tongyi Wanxiang image generation
llm.image-api-url=https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis
llm.image-model=wanx2.1-t2i-turbo
llm.image-default-size=1024*1024
llm.image-prompt-extend=true
llm.image-watermark=false
llm.image-timeout-seconds=180
llm.image-poll-interval-ms=5000

# DashScope speech recognition and synthesis
llm.asr-model=qwen3-asr-flash
tts.api-url=https://dashscope.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer
tts.model=qwen-audio-3.0-tts-flash
tts.voice=longanhuan_v3.6
tts.format=pcm
# WeChat voice uses 16 kHz SILK
tts.sample-rate=16000
tts.timeout-seconds=60

# SILK encoder (WeChat voice requires SILK format, from silk-v3-decoder project)
silk.encoder-path=bin/silk-encoder-x64.exe
silk.timeout-seconds=20

# Tavily web search settings
# API key is read from TAVILY_API_KEY environment variable or .env.local / .env file
tavily.api.url=https://api.tavily.com/search
tavily.search.max-results=5
tavily.search.timeout-seconds=15

tool.executor.parallel-threads=8

# RAG knowledge base (minimal keyword retrieval)
rag.knowledge-dir=./data/knowledge-base
rag.top-k=3
rag.max-chars=800
# Domain keywords are NOT set here: Chinese in .properties is read as ISO-8859-1 (garbled).
# They fall back to the UTF-8 default in RagService.java (退款,退货,物流,配送,...).

# Travel planning Agent (autonomous planning via function-calling)
travel.agent-max-rounds=12


amap.api-key=
amap.timeout-seconds=15


didi.client-id=
didi.client-secret=
didi.access-token=
didi.timeout-seconds=15
